name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Record pre-bump HEAD
        id: pre_bump
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bump version, changelog and tag (cocogitto)
        id: release
        uses: cocogitto/cocogitto-action@v4.1.0
        with:
          command: bump
          args: --auto

      - name: Detect whether a release actually happened
        id: bumped
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ steps.pre_bump.outputs.sha }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes for the new tag
        id: changelog
        if: steps.bumped.outputs.released == 'true'
        uses: cocogitto/cocogitto-action@v4.1.0
        with:
          command: changelog
          args: "--at ${{ steps.release.outputs.version }}"

      - name: Create GitHub Release
        if: steps.bumped.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: ${{ steps.release.outputs.version }}
          body: ${{ steps.changelog.outputs.stdout }}

      - name: Determine bump type
        id: bump_type
        if: steps.bumped.outputs.released == 'true'
        env:
          PRE_VERSION: ${{ steps.pre_bump.outputs.version }}
          NEW_VERSION: ${{ steps.release.outputs.version }}
        run: |
          IFS='.' read -r prev_major prev_minor _ <<< "${PRE_VERSION#v}"
          IFS='.' read -r new_major new_minor _ <<< "${NEW_VERSION#v}"
          if [ "$new_major" != "$prev_major" ] || [ "$new_minor" != "$prev_minor" ]; then
            echo "type=major_minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord
        if: steps.bumped.outputs.released == 'true'
        env:
          DISCORD_WEBHOOK_URL_MAJOR_MINOR: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL_MAJOR_MINOR }}
          DISCORD_WEBHOOK_URL_PATCH: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL_PATCH }}
          BUMP_TYPE: ${{ steps.bump_type.outputs.type }}
        run: |
          if [ "$BUMP_TYPE" = "patch" ]; then
            WEBHOOK_URL="$DISCORD_WEBHOOK_URL_PATCH"
          else
            WEBHOOK_URL="$DISCORD_WEBHOOK_URL_MAJOR_MINOR"
          fi
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"バージョン ${{ steps.release.outputs.version }} がリリースされました!\"}" \
            "$WEBHOOK_URL"
